<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2432"/>
      <stop offset="1" stop-color="#0c1116"/>
    </linearGradient>
  </defs>

  <!-- Badge: rounded square with one clipped corner, like a physical card -->
  <path d="M22,0 L102,0 Q128,0 128,26 L128,102 Q128,128 102,128 L26,128 Q0,128 0,102 L0,22 Z"
        fill="url(#badgeGrad)"/>

  <!-- EMV-style chip accent, tucked in the corner -->
  <g>
    <rect x="96" y="96" width="24" height="18" rx="3.5" fill="#2f8f5b"/>
    <line x1="96" y1="102.5" x2="120" y2="102.5" stroke="#215f3d" stroke-width="1.4"/>
    <line x1="96" y1="108" x2="120" y2="108" stroke="#215f3d" stroke-width="1.4"/>
    <line x1="108" y1="96" x2="108" y2="114" stroke="#215f3d" stroke-width="1.4"/>
  </g>

  <!-- Lettermark: hand-drawn Z, no external font dependency -->
  <path fill="#ffffff" d="M30,26 L90,26 L90,43 L48,77 L90,77 L90,94 L30,94 L30,77 L72,43 L30,43 Z"/>
</svg>
